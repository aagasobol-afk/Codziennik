name: Build Codziennik APK

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        run: |
          gradle lint test assembleDebug --stacktrace --info

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Codziennik-APK
          path: app/build/outputs/apk/debug/app-debug.apk
