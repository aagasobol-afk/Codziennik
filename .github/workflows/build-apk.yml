
name: Build Codziennik APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rozpakuj projekt
        run: |
          unzip -q Codziennik-Android-v1.zip -d build

      - name: Zbuduj APK
        run: |
          cd build/Codziennik
          gradle assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Codziennik-APK
          path: build/Codziennik/app/build/outputs/apk/debug/app-debug.apk
